<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A short quiz that checks foundational HTML and CSS knowledge.">
  <meta name="author" content="William Ornelas">
  <title>HTML and CSS Quiz | William Ornelas</title>
  <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
  <main>
    <h1>HTML and CSS Quiz</h1>
    <form>
      <div class="form-item">
        <label for="q1">1. Which HTML element creates a hyperlink?</label>
        <input type="text" id="q1" name="q1">
      </div>

      <div class="form-item">
        <label for="q2">2. In your own words, what is the difference between an HTML class and an ID?</label>
        <textarea id="q2" name="q2" rows="4"></textarea>
      </div>

      <div class="form-item">
        <label for="q3">3. Which CSS property creates space inside an element's border?</label>
        <select id="q3" name="q3">
          <option value="" selected disabled>Choose one...</option>
          <option value="margin">margin</option>
          <option value="padding">padding</option>
          <option value="gap">gap</option>
        </select>
      </div>

      <div class="form-item">
        <label for="q4">4. How many times should a unique ID value be used on one HTML page?</label>
        <input type="number" id="q4" name="q4" min="1">
      </div>

      <button type="submit">Submit Quiz</button>
    </form>
  </main>
</body>
</html>
